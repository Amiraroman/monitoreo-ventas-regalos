name: CI-CD ventas

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del commit
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: pytest -v
      - name: Validar referencia.csv y actual.csv
        run: python scripts/validar.py
      - name: Generar HTML (Evidently)
        run: python scripts/generar_sitio.py
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  cd:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
